name: Koi library

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Generate library
        run: cargo +stable run --locked --example generate-library -- library
      - name: Attach library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koi-library
          path: library/
          if-no-files-found: error
      # After the library is attached, so a failure still offers the sheets to copy.
      - name: Check the README's render sheets against the library
        run: |
          stale_sheets=0
          for sheet in bodies-light.png bodies-dark.png; do
            if ! cmp -s "library/$sheet" "docs/$sheet"; then
              echo "::error file=docs/$sheet::docs/$sheet does not match the generated library"
              stale_sheets=1
            fi
          done
          if [ "$stale_sheets" -ne 0 ]; then
            echo "Copy library/bodies-light.png and library/bodies-dark.png into docs/." >&2
            exit 1
          fi
