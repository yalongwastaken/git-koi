name: Action check

# Run the Action from this checkout against the repository owner and attach what
# it generates. Nothing is committed; this only proves the Action works end to end.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        with:
          output-dir: koi-output
      - name: Attach the koi
        uses: actions/upload-artifact@v7
        with:
          name: koi
          path: koi-output/
          if-no-files-found: error
