name: CI

# The gates every change passes. The ruleset on main requires both jobs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
          echo "release=$(rustc +stable --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # Keyed on the compiler as well as the lock file: a build restored for an older
      # compiler is rebuilt from scratch, and an exact key hit is never saved again.
      - name: Cache the Cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key:
            ${{ github.job }}-${{ runner.os }}-rust-${{
            steps.rust.outputs.release }}-${{ hashFiles('Cargo.lock') }}
          restore-keys:
            ${{ github.job }}-${{ runner.os }}-rust-${{
            steps.rust.outputs.release }}-
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked
      - name: Build
        run: cargo +stable build --release --locked
      - name: Document
        run: cargo +stable doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check documentation and configuration formatting
        run: npx prettier@3.9.10 --check .

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the minimum supported Rust version
        run: |
          rust_version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "RUST_VERSION=$rust_version" >> "$GITHUB_ENV"
      - name: Install it
        id: rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          echo "release=$(rustc "+$RUST_VERSION" --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache the Cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key:
            ${{ github.job }}-${{ runner.os }}-rust-${{
            steps.rust.outputs.release }}-${{ hashFiles('Cargo.lock') }}
          restore-keys:
            ${{ github.job }}-${{ runner.os }}-rust-${{
            steps.rust.outputs.release }}-
      - name: Check on it
        run: cargo "+$RUST_VERSION" check --locked --all-targets
