name: Release

# A version tag builds the binaries, publishes the GitHub Release, proves the
# Action downloads what was just released, and only then moves the major tag the
# Action is referenced by and publishes the crate, since those two cannot be
# undone. Every step that creates something skips it when it already exists, so
# a rerun is safe.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against the manifest and the changelog
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run:
          rustup toolchain install stable --profile minimal --target ${{
          matrix.target }}
      - name: Build
        run:
          cargo +stable build --release --locked --target ${{ matrix.target }}
      - name: Package with a checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_STEM:
            git-koi-${{ needs.verify.outputs.version }}-${{ matrix.target }}
        run: |
          mkdir "$ARCHIVE_STEM"
          cp LICENSE README.md CHANGELOG.md "$ARCHIVE_STEM"/
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/git-koi.exe" "$ARCHIVE_STEM"/
            archive="$ARCHIVE_STEM.zip"
            7z a -tzip "$archive" "$ARCHIVE_STEM" > /dev/null
          else
            cp "target/$TARGET/release/git-koi" "$ARCHIVE_STEM"/
            archive="$ARCHIVE_STEM.tar.gz"
            tar -czf "$archive" "$ARCHIVE_STEM"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            git-koi-*.tar.gz
            git-koi-*.zip
            git-koi-*.sha256
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish the GitHub Release with the changelog section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="$VERSION" '
            /^## \[/ { printing = index($0, "[" version "]") > 0; next }
            /^\[[^]]+\]: / { printing = 0 }
            printing
          ' CHANGELOG.md > release-notes.md
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber

  smoke:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          output-dir: koi-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koi
          path: koi-output/
          if-no-files-found: error

  publish:
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Move the major tag to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          major_tag="v${VERSION%%.*}"
          if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major_tag" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$major_tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
      - name: Check whether crates.io already has this version
        id: crates_io
        run: |
          crate_url="https://crates.io/api/v1/crates/git-koi/$VERSION"
          if curl -fsS -A "git-koi release workflow" "$crate_url" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io
        if: steps.crates_io.outputs.published == 'false'
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Install Rust
        if: steps.crates_io.outputs.published == 'false'
        run: rustup toolchain install stable --profile minimal
      - name: Publish the crate
        if: steps.crates_io.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo +stable publish --locked
