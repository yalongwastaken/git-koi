name: Release

# A version tag builds and attests the binaries, publishes the GitHub Release
# from a draft so it can be immutable, proves the Action downloads and verifies
# what was just released, and only then publishes the crate from the protected
# release environment, since that cannot be undone. The major tag the Action is
# referenced by is moved by hand afterwards, because the tag ruleset lets only an
# admin move it. Every step that creates something skips it when it already
# exists, so a rerun is safe.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against the manifest and the changelog
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Signs and stores the archive's build provenance, which the Action checks.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run:
          rustup toolchain install stable --profile minimal --target ${{
          matrix.target }}
      - name: Build
        run:
          cargo +stable build --release --locked --target ${{ matrix.target }}
      - name: Package with a checksum
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_STEM:
            git-koi-${{ needs.verify.outputs.version }}-${{ matrix.target }}
        run: |
          mkdir "$ARCHIVE_STEM"
          cp LICENSE README.md CHANGELOG.md "$ARCHIVE_STEM"/
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/git-koi.exe" "$ARCHIVE_STEM"/
            archive="$ARCHIVE_STEM.zip"
            7z a -tzip "$archive" "$ARCHIVE_STEM" > /dev/null
          else
            cp "target/$TARGET/release/git-koi" "$ARCHIVE_STEM"/
            archive="$ARCHIVE_STEM.tar.gz"
            tar -czf "$archive" "$ARCHIVE_STEM"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Attest the archive's build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      # The signed bundle ships beside the archive, so the Action verifies it
      # without calling the attestation API and needs no extra token permission.
      - name: Keep the attestation bundle beside the archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$ARCHIVE.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            git-koi-*.tar.gz
            git-koi-*.zip
            git-koi-*.sha256
            git-koi-*.sigstore.json
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      # An immutable release takes no assets once published, so the release is
      # drafted, given its assets, and only then published. A rerun finds the draft
      # and finishes it, or finds the release published and leaves it alone.
      - name: Publish the GitHub Release with the changelog section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="$VERSION" '
            /^## \[/ { printing = index($0, "[" version "]") > 0; next }
            /^\[[^]]+\]: / { printing = 0 }
            printing
          ' CHANGELOG.md > release-notes.md
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi

  smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          output-dir: koi-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koi-${{ matrix.runner }}
          path: koi-output/
          if-no-files-found: error

  publish:
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    # crates.io trusts only runs in this environment, which admits version tags
    # alone and waits for a maintainer's approval.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether crates.io already has this version
        id: crates_io
        run: |
          crate_url="https://crates.io/api/v1/crates/git-koi/$VERSION"
          if curl -fsS -A "git-koi release workflow" "$crate_url" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io
        if: steps.crates_io.outputs.published == 'false'
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Install Rust
        if: steps.crates_io.outputs.published == 'false'
        run: rustup toolchain install stable --profile minimal
      - name: Publish the crate
        if: steps.crates_io.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo +stable publish --locked
      # The workflow's token cannot bypass a ruleset on a repository a user owns,
      # so an admin moves the major tag; until then the Action stays on the last.
      - name: Say how to move the major tag to this release
        run: |
          major_tag="v${VERSION%%.*}"
          {
            echo "### Move \`$major_tag\` to \`$GITHUB_REF_NAME\`"
            echo
            echo "As a repository admin, run:"
            echo
            echo '```sh'
            echo "gh api --method PATCH repos/$GITHUB_REPOSITORY/git/refs/tags/$major_tag -f sha=$GITHUB_SHA -F force=true"
            echo '```'
            echo
            echo "If \`$major_tag\` does not exist yet, create it instead:"
            echo
            echo '```sh'
            echo "gh api --method POST repos/$GITHUB_REPOSITORY/git/refs -f ref=refs/tags/$major_tag -f sha=$GITHUB_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
