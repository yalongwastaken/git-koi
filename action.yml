name: git-koi
description:
  Draw a GitHub account's koi from its public activity as a looping GIF, a still
  PNG, and a local preview. Generates files only; committing them belongs to the
  calling workflow.

inputs:
  login:
    description: Account whose koi to draw.
    default: ${{ github.repository_owner }}
  body:
    description: Body color, one of white, black, asagi, tea, gold, or platinum.
    default: white
  output-dir:
    description:
      Folder, relative to the workspace, that receives koi.gif, koi.png, and
      preview.html.
    default: koi
  token:
    description:
      Token for reading the account's public data; the built-in token is enough.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Build git-koi
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        cargo +stable install --locked --path "$GITHUB_ACTION_PATH" --root "$RUNNER_TEMP/git-koi"
    - name: Collect the account snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        KOI_LOGIN: ${{ inputs.login }}
      run: |
        "$RUNNER_TEMP/git-koi/bin/git-koi" collect "$KOI_LOGIN" --output "$RUNNER_TEMP/koi-snapshot.json"
    - name: Render the koi
      shell: bash
      env:
        KOI_BODY: ${{ inputs.body }}
        KOI_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        "$RUNNER_TEMP/git-koi/bin/git-koi" render "$RUNNER_TEMP/koi-snapshot.json" --output-dir "$KOI_OUTPUT_DIR" --body "$KOI_BODY"
