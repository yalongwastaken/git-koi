name: git-profile-koi
description:
  Draw a GitHub account's koi from its public activity as a looping GIF, a still
  PNG, and a preview, for a profile README.
branding:
  icon: droplet
  color: blue

inputs:
  login:
    description: Account whose koi to draw.
    default: ${{ github.repository_owner }}
  logins:
    description: Newline-separated list of GitHub account logins for a multi-koi pond. When set, overrides `login`.
    required: false
    default: ''
  body:
    description: Body color, one of white, black, asagi, tea, gold, or platinum.
    default: white
  size:
    description:
      Pond size in native pixels as WIDTHxHEIGHT, each side at least 256 and the
      area at most 2048x256. A pond that is not square swims a new track each
      day.
    default: 256x256
  scale:
    description:
      Export pixels per native pixel on each side, 1 through 4. A large pond's
      GIF may be too heavy for phones at 2; try 1.
    default: "2"
  output-dir:
    description:
      Folder, relative to the workspace, that receives koi.gif, koi.png, and
      preview.html.
    default: koi
  token:
    description:
      Token for reading the account's public data. Keep the built-in token,
      since the Action's process holds whatever token it is given and the
      built-in one reaches only this repository, for this job.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Download the git-koi release this Action belongs to
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        version=$(grep -m1 '^version' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        repository=$(grep -m1 '^repository' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-musl ;;
          Linux-ARM64) target=aarch64-unknown-linux-musl ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          Windows-X64) target=x86_64-pc-windows-msvc ;;
          *)
            echo "git-koi has no build for $RUNNER_OS $RUNNER_ARCH; use ubuntu-latest" >&2
            exit 1
            ;;
        esac
        if [ "$RUNNER_OS" = Windows ]; then
          archive="git-koi-$version-$target.zip"
        else
          archive="git-koi-$version-$target.tar.gz"
        fi
        install_dir="$RUNNER_TEMP/git-koi"
        mkdir -p "$install_dir"
        if ! gh release download "v$version" --repo "$repository" --dir "$install_dir" \
            --pattern "$archive" --pattern "$archive.sha256"; then
          echo "release v$version has no asset $archive; reference the Action at a release tag" >&2
          exit 1
        fi
        cd "$install_dir"
        if command -v sha256sum > /dev/null; then
          sha256sum -c "$archive.sha256"
        else
          shasum -a 256 -c "$archive.sha256"
        fi
        case "$archive" in
          *.zip) unzip -q "$archive" ;;
          *) tar -xzf "$archive" ;;
        esac
        echo "$install_dir/git-koi-$version-$target" >> "$GITHUB_PATH"
    - name: Collect account snapshots
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        KOI_LOGIN: ${{ inputs.login }}
        KOI_LOGINS: ${{ inputs.logins }}
      run: |
        # Determine which logins to collect: use logins if set, otherwise use login
        if [ -z "$KOI_LOGINS" ]; then
          logins="$KOI_LOGIN"
        else
          logins="$KOI_LOGINS"
        fi

        # Collect a snapshot for each login
        snapshots_dir="$RUNNER_TEMP/koi-snapshots"
        mkdir -p "$snapshots_dir"

        while IFS= read -r login; do
          # Skip empty lines
          [ -z "$login" ] && continue
          echo "Collecting snapshot for $login..."
          git-koi collect "$login" --output "$snapshots_dir/$login.json"
        done <<< "$logins"

        # Store snapshots directory for the render step
        echo "KOIS_SNAPSHOTS_DIR=$snapshots_dir" >> "$GITHUB_ENV"
    - name: Render the koi
      shell: bash
      env:
        KOI_BODY: ${{ inputs.body }}
        KOI_SIZE: ${{ inputs.size }}
        KOI_SCALE: ${{ inputs.scale }}
        KOI_OUTPUT_DIR: ${{ inputs.output-dir }}
        KOI_LOGINS: ${{ inputs.logins }}
      run: |
        # Determine if rendering single or multi-koi
        if [ -z "$KOI_LOGINS" ]; then
          # Single koi: use render with --body option
          snapshot="$RUNNER_TEMP/koi-snapshots"/*
          git-koi render "$snapshot" --output-dir "$KOI_OUTPUT_DIR" --body "$KOI_BODY" --size "$KOI_SIZE" --scale "$KOI_SCALE"
        else
          # Multi-koi: use render-multi without --body (all use default body)
          snapshots=()
          while IFS= read -r login; do
            [ -z "$login" ] && continue
            snapshots+=("$RUNNER_TEMP/koi-snapshots/$login.json")
          done <<< "$KOI_LOGINS"
          git-koi render-multi "${snapshots[@]}" --output-dir "$KOI_OUTPUT_DIR" --size "$KOI_SIZE" --scale "$KOI_SCALE"
        fi
